name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: npm

      - run: npm ci

      # The Prisma client is generated code and isn't committed, so nothing
      # typechecks until it exists.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check migrations match the schema
        # Catches a schema.prisma edit that was never turned into a migration —
        # the failure mode where local dev works and production drifts.
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code && echo "Schema and migrations are in sync."
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
        continue-on-error: true

      - run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders. Every page is dynamic and authenticates at
          # request time, so nothing here connects to a real service.
          DATABASE_URL: postgresql://user:pass@localhost:5432/studyforge
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  pinger:
    name: Validate keep-alive Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/pinger
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"

      - run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Worker bundle
        # Dry run catches config and bundling errors without needing
        # Cloudflare credentials, so this stays green on fork PRs.
        run: npx wrangler deploy --dry-run
